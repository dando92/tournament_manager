server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML must be revalidated so a deployment never keeps references to old chunks.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Deploy-time configuration must never be cached
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    # Assets are content-hashed, but local deployments are rebuilt frequently.
    # Revalidation prevents a stale module graph from blanking the application.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
