name: tournament-manager-local

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-tournament_manager}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tournament_manager}
      POSTGRES_DB: ${DATABASE_NAME:-tournament_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrations:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: "no"
    command: ["npm", "run", "migration:run:prod", "--workspace=tournament_manager_backend"]
    environment: &application-environment
      NODE_ENV: production
      AUTH_MODE: local
      LOCAL_API_KEY: ${LOCAL_API_KEY:-local-development-key}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-tournament_manager}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-tournament_manager}
      DATABASE_NAME: ${DATABASE_NAME:-tournament_manager}
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_STREAM: ${EVENT_STREAM:-tournament-manager.events}
      EVENT_CONSUMER_GROUP: ${EVENT_CONSUMER_GROUP:-tournament-manager-processor}
      SYNCSTART_COMMAND_STREAM: ${SYNCSTART_COMMAND_STREAM:-tournament-manager.syncstart.commands}
      SYNCSTART_CONSUMER_GROUP: ${SYNCSTART_CONSUMER_GROUP:-tournament-manager-syncstart}
      SYNCSTART_COMMAND_TIMEOUT_MS: ${SYNCSTART_COMMAND_TIMEOUT_MS:-15000}
      LIVE_EVENT_CHANNEL: ${LIVE_EVENT_CHANNEL:-tournament-manager.live}
      OUTBOX_RELAY_IDLE_INTERVAL_MS: ${OUTBOX_RELAY_IDLE_INTERVAL_MS:-200}
      EVENT_CONSUMER_BLOCK_MS: ${EVENT_CONSUMER_BLOCK_MS:-500}
      EVENT_RECLAIM_IDLE_MS: ${EVENT_RECLAIM_IDLE_MS:-250}
      TOURNAMENT_TRANSPORT_RETENTION_DAYS: ${TOURNAMENT_TRANSPORT_RETENTION_DAYS:-10}
      TRANSPORT_RETENTION_SWEEP_INTERVAL_MS: ${TRANSPORT_RETENTION_SWEEP_INTERVAL_MS:-21600000}
      TRANSPORT_RETENTION_BATCH_SIZE: ${TRANSPORT_RETENTION_BATCH_SIZE:-1000}
      STARTGG_API_URL: ${STARTGG_API_URL:-https://api.start.gg/gql/alpha}
      STARTGG_PER_PAGE: ${STARTGG_PER_PAGE:-64}
      STARTGG_MIN_INTERVAL_MS: ${STARTGG_MIN_INTERVAL_MS:-1000}
      LOCAL_SEED_ENABLED: ${LOCAL_SEED_ENABLED:-true}
      LOCAL_SEED_TOURNAMENT_NAME: ${LOCAL_SEED_TOURNAMENT_NAME:-Local E2E Tournament}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      processor:
        condition: service_healthy
      syncstart:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  processor:
    build:
      context: .
      dockerfile: apps/processor/Dockerfile
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  syncstart:
    build:
      context: .
      dockerfile: apps/syncstart/Dockerfile
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      redis:
        condition: service_healthy
      syncstart-simulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  syncstart-simulator:
    build:
      context: .
      dockerfile: apps/syncstart/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/syncstart/dist/src/testing/simulator-main.js"]
    environment:
      SYNCSTART_SIMULATOR_PORT: 19000

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-http://localhost:3000/}
        VITE_PUBLIC_ENABLE_LIVE_SCORES: ${VITE_PUBLIC_ENABLE_LIVE_SCORES:-true}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
