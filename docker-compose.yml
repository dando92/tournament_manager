name: tournament-manager-local

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-tournament_manager}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tournament_manager}
      POSTGRES_DB: ${DATABASE_NAME:-tournament_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrations:
    build:
      context: .
      dockerfile: apps/migrations/Dockerfile
    restart: "no"
    environment: &application-environment
      NODE_ENV: production
      AUTH_MODE: local
      LOCAL_API_KEY: ${LOCAL_API_KEY:-local-development-key}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-tournament_manager}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-tournament_manager}
      DATABASE_NAME: ${DATABASE_NAME:-tournament_manager}
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token}
      SYNCSTART_INTERNAL_URL: ${SYNCSTART_INTERNAL_URL:-http://syncstart:3002}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      INTERNAL_HTTP_TIMEOUT_MS: ${INTERNAL_HTTP_TIMEOUT_MS:-5000}
      LIVE_EVENT_CHANNEL: ${LIVE_EVENT_CHANNEL:-tournament-manager.live}
      STARTGG_API_URL: ${STARTGG_API_URL:-https://api.start.gg/gql/alpha}
      STARTGG_PER_PAGE: ${STARTGG_PER_PAGE:-64}
      STARTGG_MIN_INTERVAL_MS: ${STARTGG_MIN_INTERVAL_MS:-1000}
      LOCAL_FIXTURE_TOURNAMENT_NAME: ${LOCAL_FIXTURE_TOURNAMENT_NAME:-Local E2E Tournament}
      LOCAL_FIXTURE_SYNCSTART_URL: ${LOCAL_FIXTURE_SYNCSTART_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      local-fixtures:
        condition: service_completed_successfully
      syncstart:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  syncstart:
    build:
      context: .
      dockerfile: apps/syncstart/Dockerfile
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  syncstart-simulator:
    build:
      context: .
      dockerfile: tools/syncstart-simulator/Dockerfile
    restart: unless-stopped
    profiles: ["simulator"]
    environment:
      SYNCSTART_SIMULATOR_PORT: 19000

  local-fixtures:
    build:
      context: .
      dockerfile: apps/local-fixtures/Dockerfile
    restart: "no"
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      syncstart:
        condition: service_healthy

  realtime-a:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3003}:3003"
    environment: *application-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3003/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  realtime-b:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    ports:
      - "${REALTIME_REPLICA_PORT:-3004}:3003"
    environment: *application-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3003/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/}
      PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-http://localhost:3003/}
      PUBLIC_AUTH_MODE: ${PUBLIC_AUTH_MODE:-local}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
